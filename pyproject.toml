[project]
name = "tornadochildd"
version = "0.1.4"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tornadochildd", email = "tornadochildd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "torch>=2.14.0",
]

[tool.maturin]
module-name = "tornadochildd._core"
python-packages = ["tornadochildd"]
python-source = "src"
compatibility = "pypi"
auditwheel = "repair"
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

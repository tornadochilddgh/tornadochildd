[project]
name = "tornadochildd"
version = "0.1.7"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tornadochildd", email = "tornadochildd@gmail.com" }
]
requires-python = ">=3.12"
ddependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "torch>=2.2",
]

[tool.maturin]
module-name = "tornadochildd._core"
python-packages = ["tornadochildd"]
python-source = "src"
compatibility = "pypi"
auditwheel = "repair"
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
